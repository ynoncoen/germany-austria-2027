<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Rounded Alpine Badge Background -->
  <rect width="64" height="64" rx="15" fill="url(#sky)"/>
  <!-- Glowing Alpine Sun -->
  <circle cx="45" cy="19" r="12" fill="#fde047" opacity="0.25"/>
  <circle cx="45" cy="19" r="8.5" fill="url(#sun)"/>
  <!-- Distant Secondary Peak (Right) -->
  <polygon points="30,50 47,23 62,50" fill="#1e3a5f"/>
  <polygon points="47,23 62,50 47,50" fill="#0f2942"/>
  <polygon points="47,23 41.5,31.8 45,30 47,33 49.5,29.5 52.5,31.8" fill="#e0f2fe"/>
  <!-- Main Zugspitze Peak (Left/Center) -->
  <polygon points="3,50 24,14 45,50" fill="#334155"/>
  <polygon points="24,14 45,50 24,50" fill="#1e293b"/>
  <!-- Crisp Snow Cap on Main Peak -->
  <polygon points="24,14 15.5,28.5 20,26 24,30 27.5,25.5 32.5,28.5" fill="#ffffff"/>
  <polygon points="24,14 24,30 27.5,25.5 32.5,28.5" fill="#bae6fd"/>
  <!-- Turquoise Alpine Lake Base -->
  <path d="M0,49 Q16,46 32,49 T64,49 L64,64 L0,64 Z" fill="url(#lake)" clip-path="inset(0 0 0 0 round 15px)"/>
  <path d="M10,55 Q24,52.5 38,55 T56,54.5" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
</svg>
